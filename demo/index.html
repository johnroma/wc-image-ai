<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wc-img-ai demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 3rem auto;
        padding: 0 1rem;
        color: #222;
      }
      h1 { font-size: 1.4rem; }
      .row { display: flex; gap: 0.5rem; margin: 1rem 0; align-items: center; }
      input[type="text"] { flex: 1; padding: 0.5rem; font: inherit; }
      .references { display: grid; gap: 0.35rem; margin: 1rem 0; }
      .references small { color: #666; }
      button { padding: 0.5rem 1rem; font: inherit; cursor: pointer; }
      ai-img { border: 1px solid #eee; border-radius: 8px; }
      pre { background: #f6f6f6; padding: 0.75rem; border-radius: 8px; overflow-x: auto; }
      code { background: #f6f6f6; padding: 0 0.25rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>&lt;ai-img&gt; demo</h1>
    <p>
      Type a prompt, optionally add reference images, and generate. The server
      mints an id, stores the PNG and returns <code>{ id, url }</code>.
      Re-rendering with that <code>image-id</code> fetches the stored image
      instead of calling the AI.
    </p>

    <div class="row">
      <label for="prompt">Prompt</label>
      <input type="text" id="prompt" placeholder="a funny dolphin up to no good" value="a funny dolphin up to no good" />
      <button type="button" id="go" aria-busy="false">Generate</button>
    </div>

    <label class="references">
      Reference images
      <input
        id="references"
        type="file"
        accept="image/png,image/jpeg,image/webp"
        multiple
      />
      <small>Optional PNG, JPEG, or WebP files. Up to 4 files, 5 MiB each
        and 10 MiB total. Selection order is preserved.</small>
    </label>

    <div id="stage"></div>

    <p>Generation status:</p>
    <pre id="event" role="status" aria-live="polite" aria-atomic="true">—</pre>

    <script type="module" src="/dist/wc-img-ai.js"></script>
    <script type="module">
      import { createGenerationFlow } from "/demo/media-prompt.js"

      const stage = document.getElementById("stage")
      const eventOut = document.getElementById("event")
      const go = document.getElementById("go")
      const generate = createGenerationFlow({
        button: go,
        status: eventOut,
        stage,
        createImage: () => document.createElement("ai-img"),
      })

      go.addEventListener("click", () => {
        const prompt = document.getElementById("prompt").value
        const files = document.getElementById("references").files ?? []
        void generate(prompt, files)
      })
    </script>
  </body>
</html>
